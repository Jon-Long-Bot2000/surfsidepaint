<svg xmlns="http://www.w3.org/2000/svg" width="445" height="615" viewBox="17.5 177 445 615" role="img" aria-labelledby="title desc"><title id="title">S1 — The classic pricing card</title><desc id="desc">$150 per month. Subscription includes two service hours each month. Service hours apply to handyman requests and maintenance plans. Unused hours roll over up to six months. Additional service hours invoiced at $75/hour. Materials billed separately.</desc><defs><linearGradient id="price-featured-border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#537c74"/><stop offset=".24" stop-color="#c6d6c7"/><stop offset=".47" stop-color="#bda575"/><stop offset=".66" stop-color="#e0d5b9"/><stop offset=".83" stop-color="#76988b"/><stop offset="1" stop-color="#315f59"/></linearGradient><linearGradient id="price-featured-divider" href="#price-featured-border" gradientUnits="userSpaceOnUse" x1="18" y1="176" x2="462" y2="176"/><filter id="price-ambient-shadow" x="-35%" y="-20%" width="170%" height="150%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#183e47" flood-opacity=".025"/><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#183e47" flood-opacity=".035"/><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#146657" flood-opacity=".055"/><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#146657" flood-opacity=".035"/></filter><filter id="price-cta-ambient" x="-25%" y="-100%" width="150%" height="400%" color-interpolation-filters="sRGB"><feDropShadow in="SourceGraphic" dx="0" dy="2" stdDeviation="2" flood-color="#183e47" flood-opacity=".025" result="cta-contact"/><feDropShadow in="SourceGraphic" dx="0" dy="6" stdDeviation="6" flood-color="#183e47" flood-opacity=".03" result="cta-soft"/><feDropShadow in="SourceGraphic" dx="0" dy="8" stdDeviation="7" flood-color="#146657" flood-opacity=".055" result="cta-brand"/><feDropShadow in="SourceGraphic" dx="0" dy="12" stdDeviation="11" flood-color="#146657" flood-opacity=".025" result="cta-ambient"/><feMerge><feMergeNode in="cta-ambient"/><feMergeNode in="cta-brand"/><feMergeNode in="cta-soft"/><feMergeNode in="cta-contact"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="benefits-top-fade" gradientUnits="userSpaceOnUse" x1="0" y1="177" x2="0" y2="237"><stop offset="0" stop-color="#f6f3e7" stop-opacity=".05"/><stop offset="1" stop-color="#f6f3e7" stop-opacity="1"/></linearGradient></defs><style>.price-join,.price-cta-note{visibility:hidden}</style><text x="43" y="62" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="650" fill="#183e47" text-anchor="start" letter-spacing="1.1">BILLED AT</text><text x="43" y="139" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="67" font-weight="650" fill="#183e47" letter-spacing="-2" text-anchor="start">$150<tspan dx="7" font-size="23" font-weight="450" letter-spacing="0" fill="#183e47">/month</tspan></text><path d="M37 177H443a18 18 0 0 1 18 18V775a17 17 0 0 1-17 17H36a17 17 0 0 1-17-17V195a18 18 0 0 1 18-18Z" fill="url(#benefits-top-fade)"/><g id="subscription-benefits" transform="translate(20 38)"><path d="m39 215 5 5 10-12" stroke="#146657" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="222" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Subscription includes two</text><text x="71" y="252" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">service hours each month.</text><path d="m39 293 5 5 10-12" stroke="#146657" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="300" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Service hours apply to handyman</text><text x="71" y="330" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">requests and maintenance plans.</text><path d="m39 371 5 5 10-12" stroke="#146657" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="378" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Unused hours roll over</text><text x="71" y="408" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">up to six months.</text><path d="m39 449 5 5 10-12" stroke="#146657" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="456" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Additional service hours</text><text x="71" y="486" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">invoiced at $75/hour.</text><path d="m39 527 5 5 10-12" stroke="#146657" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="534" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Materials billed separately.</text></g><a class="price-join" href="https://sshs-staging.pages.dev/login" target="_blank" rel="noopener noreferrer" aria-label="Join Surfside Home Services"><rect x="43" y="643" width="394" height
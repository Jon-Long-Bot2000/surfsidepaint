<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f4f6f5">
    <title>Echo Park | Surfside Painting Company Proposal</title>
    <meta name="description" content="View and download the Surfside Painting Company proposal for Echo Park.">
    <link rel="stylesheet" href="./styles.css?v=3">
    <script type="module" src="./viewer.mjs"></script>
    <script type="module" src="./gallery.mjs?v=4"></script>
  </head>
  <body>
    <a class="skip-link" href="#proposal">Skip to proposal</a>
    <header class="page-header">
      <nav class="site-nav" aria-label="Surfside navigation">
        <a class="site-brand" href="https://www.surfsidepaint.com/" aria-label="Surfside Painting Company home">
          <img src="./brand-mark.png" width="44" height="44" alt="">
          <span>Surfside<span>Painting Company</span></span>
        </a>
        <a class="home-link" href="https://www.surfsidepaint.com/">Home</a>
      </nav>
    </header>
    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <h1 id="hero-title">Surfside Paint</h1>
          <p>Echo Park Restoration</p>
        </div>
        <figure class="hero-photo"><img src="./hero.webp" width="1350" height="1800" alt="Echo Park restoration work area with ceiling and skylight protection." fetchpriority="high"></figure>
      </section>
      <section id="proposal" class="proposal-section" aria-labelledby="proposal-title" tabindex="-1">
        <div class="proposal-heading">
          <h2 id="proposal-title">Proposal</h2>
          <a class="download-button" href="./echo-park_Surfside_Proposal.pdf" download="echo-park_Surfside_Proposal.pdf">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg>
            <span>Download PDF</span>
          </a>
        </div>

      <p id="viewer-status" class="viewer-status" role="status">Loading proposal…</p>
      <a class="proposal-document-link" href="./echo-park_Surfside_Proposal.pdf" aria-label="Open proposal PDF">
        <div id="pdf-pages" class="pdf-pages" aria-label="Proposal document"></div>
        <div id="fallback" class="fallback" hidden>
          <img src="./proposal-preview.png" width="1160" height="1500" alt="Surfside Painting Company proposal for Echo Park.">
        </div>
      </a>
      <noscript>
        <div class="fallback">
          <p><a href="./echo-park_Surfside_Proposal.pdf">Open the PDF</a> or use the download button above.</p>
          <a class="proposal-document-link" href="./echo-park_Surfside_Proposal.pdf" aria-label="Open proposal PDF"><img src="./proposal-preview.png" width="1160" height="1500" alt="Surfside Painting Company proposal for Echo Park."></a>
        </div>
      </noscript>
      </section>
      <section class="gallery" aria-labelledby="gallery-title">
        <div class="gallery-heading">
          <h2 id="gallery-title">Photo Gallery</h2>
          <p>Echo Park</p>
        </div>
        <div class="gallery-page-heading">
          <div class="gallery-tabs" role="tablist" aria-label="Photo gallery stage">
            <button id="before-tab" class="gallery-tab" type="button" role="tab" aria-selected="true" aria-controls="before-panel">Before</button>
            <button id="after-tab" class="gallery-tab" type="button" role="tab" aria-selected="false" aria-controls="after-panel" tabindex="-1">After</button>
          </div>
          <p id="gallery-count">5 photos</p>
        </div>
        <div id="before-panel" class="gallery-panel" role="tabpanel" aria-labelledby="before-tab">
        <p class="gallery-empty" hidden>Photos added as they become available.</p>
        <div class="photo-grid" aria-label="Before photos">
          <a class="gallery-photo" href="./gallery/before/001.webp" aria-label="Open before photo 1 of 5"><img src="./gallery/before/thumbs/001.webp" width="480" height="640" alt="Before project photo 1 of 5" loading="lazy" decoding="async"><span aria-hidden="true">01</span></a>
<a class="gallery-photo" href="./gallery/before/002.webp" aria-label="Open before photo 2 of 5"><img src="./gallery/before/thumbs/002.webp" width="379" height="640" alt="Before project photo 2 of 5" loading="lazy" decoding="async"><span aria-hidden="true">02</span></a>
<a class="gallery-photo" href="./gallery/before/003.webp" aria-label="Open before photo 3 of 5"><img src="./gallery/before/thumbs/003.webp" width="385" height="640" alt="Before project photo 3 of 5" loading="lazy" decoding="async"><span aria-hidden="true">03</span></a>
<a class="gallery-photo" href="./gallery/before/004.webp" aria-label="Open before photo 4 of 5"><img src="./gallery/before/thumbs/004.webp" width="486" height="640" alt="Before project photo 4 of 5" loading="lazy" decoding="async"><span aria-hidden="true">04</span></a>
<a class="gallery-photo" href="./gallery/before/005.webp" aria-label="Open before photo 5 of 5"><img src="./gallery/before/thumbs/005.webp" width="640" height="480" alt="Before project photo 5 of 5" loading="lazy" decoding="async"><span aria-hidden="true">05</span></a>
        </div>
        </div>
        <div id="after-panel" class="gallery-panel" role="tabpanel" aria-labelledby="after-tab" tabindex="0" hidden>
          <p class="gallery-empty">Photos added as they become available.</p>
          <div class="photo-grid" aria-label="After photos"></div>
        </div>
      </section>
    </main>
    <dialog class="photo-dialog" aria-label="Before photo viewer">
      <div class="photo-viewer">
        <div class="photo-viewer-toolbar">
          <p id="photo-caption" aria-live="polite"></p>
          <button class="photo-close" type="button" aria-label="Close photo viewer" autofocus>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
          </button>
        </div>
        <div class="photo-stage">
          <button class="photo-previous" type="button" aria-label="Previous photo">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
          </button>
          <img id="expanded-photo" alt="">
          <button class="photo-next" type="button" aria-label="Next photo">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </dialog>
  </body>
</html>

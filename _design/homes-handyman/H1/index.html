<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>H1 · Handyman Requests illustration</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f7f4; color: #183e47; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 24px 32px; font-size: 12px; color: #536d6b; }
    header span { text-transform: uppercase; letter-spacing: .12em; }
    a { color: inherit; text-underline-offset: 4px; }
    main { max-width: 760px; margin: 36px auto 60px; padding: 0 24px; text-align: center; }
    h1 { margin: 0; font-size: clamp(33.6px, 4.8vw, 48px); letter-spacing: -.045em; line-height: 1.15; font-weight: 650; }
    h1 { white-space: nowrap; }
    h1 em { position: relative; display: inline-block; color: #146657; font-family: Georgia, 'Times New Roman', serif; font-weight: 400; }
    p { margin: 12px 0 28px; font-size: 18px; color: #536d6b; }
    img { display: block; width: 100%; max-width: 600px; height: auto; margin: 0 auto; transform: translateY(-10px) rotate(-7deg) scale(1.08); transform-origin: center; }
    .note { margin-top: 28px; font-size: 12px; }
    @media (max-width: 600px) { header { padding: 20px; font-size: 10px; } main { margin-top: 40px; padding-inline: 16px; } }
  </style>
</head>
<body>
  <header><span>H1 · Illustration preview</span><a href="/homes/">Back to Homes</a></header>
  <main>
    <h1>Handyman <em>requests</em></h1>
    <p>Address minor repairs.</p>
    <img src="illustration.svg?v=house-letter-1" width="360" height="270" alt="A worn stucco house with a broken window and wall cracks, overlaid with a repair-request letter and envelope.">
    <p class="note">House + repair request · H1 study</p>
  </main>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="360" height="270" viewBox="0 0 360 270" role="img" aria-labelledby="title desc"><title id="title">P1A — membership card</title><desc id="desc">An upright cream membership card with a dark outline, a green band around the inside edge, and a centered $150 per month price.</desc><ellipse cx="178" cy="243" rx="118" ry="10" fill="#183e47" opacity=".06"/><rect x="48" y="35" width="250" height="202" rx="18" fill="#dfe9da"/><g transform="rotate(0 175 137)"><rect x="49" y="52" width="252" height="171" rx="17" fill="#f6f3e7" stroke="#183e47" stroke-width="5"/><rect x="58" y="61" width="234" height="153" rx="10" fill="none" stroke="#146657" stroke-width="8"/><text x="175" y="155" fill="#183e47" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="57" font-weight="650" letter-spacing="-3" text-anchor="middle">$150<tspan dx="8" fill="#146657" font-size="19" font-weight="550" letter-spacing="0">/ month</tspan></text></g></svg>
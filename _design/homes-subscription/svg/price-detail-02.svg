<svg xmlns="http://www.w3.org/2000/svg" width="480" height="700" viewBox="0 0 480 700" role="img" aria-labelledby="title desc"><title id="title">P2 — Two hours, two uses</title><desc id="desc">$150 per month. Two home service hours included each month. Service hours can apply to handyman requests and maintenance plans. Unused hours roll over up to six months. Additional service hours billed at $75 per man hour. Materials billed separately.</desc><ellipse cx="240" cy="678" rx="190" ry="10" fill="#183e47" opacity=".06"/><rect x="34" y="36" width="424" height="626" rx="20" fill="#dfe9da" stroke="none" stroke-width="1"/><rect x="24" y="24" width="424" height="626" rx="19" fill="#ffffff" stroke="#183e47" stroke-width="4"/><text x="236" y="112" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="61" fill="#183e47" font-weight="650" letter-spacing="-2" text-anchor="middle">$150<tspan dx="7" font-size="23" font-weight="500" letter-spacing="0" fill="#146657">/month</tspan></text><path d="M51 139H421" stroke="#c7d8ca" stroke-width="1.5"/><text x="115" y="239" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="101" fill="#146657" font-weight="650" text-anchor="middle" letter-spacing="0">2</text><text x="177" y="186" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" fill="#183e47" font-weight="600" text-anchor="start" letter-spacing="0">home service</text><text x="177" y="215" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" fill="#183e47" font-weight="600" text-anchor="start" letter-spacing="0">hours included</text><text x="177" y="244" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" fill="#183e47" font-weight="600" text-anchor="start" letter-spacing="0">each month</text><rect x="48" y="278" width="180" height="105" rx="12" fill="#f6f3e7" stroke="#c7d8ca" stroke-width="1.5"/><rect x="244" y="278" width="180" height="105" rx="12" fill="#f6f3e7" stroke="#c7d8ca" stroke-width="1.5"/><g transform="translate(138 304) scale(0.65)"><path d="M10-15A13 13 0 0 0-5 0L-19 14a5 5 0 0 0 7 7L2 7A13 13 0 0 0 17-8L9 0 1-8Z" fill="#146657"/><circle cx="-15" cy="17" r="1.5" fill="#f6f3e7"/></g><g transform="translate(334 304) scale(0.65)" fill="none" stroke="#146657" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="-15" y="-12" width="30" height="28" rx="4"/><path d="M-15-4h30M-8-17v9m16-9v9"/><path d="m-7 6 4.0 4.0 8.8 -10.4" fill="none" stroke="#146657" stroke-width="2.2399999999999998" stroke-linecap="round" stroke-linejoin="round"/></g><text x="138" y="344" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" fill="#183e47" font-weight="600" text-anchor="middle" letter-spacing="0">Handyman</text><text x="138" y="369" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" fill="#183e47" font-weight="600" text-anchor="middle" letter-spacing="0">requests</text><text x="334" y="344" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" fill="#183e47" font-weight="600" text-anchor="middle" letter-spacing="0">Maintenance</text><text x="334" y="369" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" fill="#183e47" font-weight="600" text-anchor="middle" letter-spacing="0">plans</text><path d="M51 411H421" stroke="#c7d8ca" stroke-width="1.5"/><text x="51" y="448" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" fill="#183e47" font-weight="500" text-anchor="start" letter-spacing="0">Unused hours roll over</text><text x="51" y="477" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" fill="#183e47" font-weight="500" text-anchor="start" letter-spacing="0">up to 6 months.</text><text x=
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="270" viewBox="0 0 360 270" role="img" aria-labelledby="title desc"><title id="title">P3 — Card in a sleeve</title><desc id="desc">A membership pass tucked into a stitched sage sleeve, adding physical depth like H1 and M1. Billed at $150 per month.</desc><ellipse cx="178" cy="243" rx="118" ry="10" fill="#183e47" opacity=".06"/><rect x="48" y="35" width="250" height="202" rx="18" fill="#dfe9da"/><g transform="rotate(4 181 132)"><rect x="62" y="39" width="240" height="170" rx="13" fill="#f6f3e7" stroke="#183e47" stroke-width="3"/><text x="182" y="66" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="8" fill="#146657" font-weight="650" text-anchor="middle" letter-spacing="0.9">SURFSIDE HOME SERVICES</text><text x="182" y="94" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" fill="#183e47" font-weight="650" text-anchor="middle" letter-spacing="1.1">BILLED AT</text><text x="182" y="140" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="43" font-weight="650" fill="#183e47" text-anchor="middle" letter-spacing="-1.8">$150<tspan dx="6" font-size="17" font-weight="500" letter-spacing="0">/month</tspan></text><path d="M88 156h185" stroke="#c7d8ca" stroke-width="1.5" stroke-linecap="round"/></g><path d="M60 164h94q24 27 48 0h95a15 15 0 0 1 15 15v40a15 15 0 0 1-15 15H60a15 15 0 0 1-15-15v-40a15 15 0 0 1 15-15Z" fill="#c7d8ca" stroke="#183e47" stroke-width="3" stroke-linejoin="round"/><path d="M56 184v35a5 5 0 0 0 5 5h235a5 5 0 0 0 5-5v-35" fill="none" stroke="#146657" stroke-width="1" stroke-dasharray="3 4"/><text x="178" y="206" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#146657" font-weight="700" text-anchor="middle" letter-spacing="1.8">SURFSIDE</text><text x="178" y="220" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI'
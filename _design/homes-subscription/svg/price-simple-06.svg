<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="title desc"><title id="title">S6 — The familiar tier card</title><desc id="desc">$150 per month. Subscription includes two service hours each month. Apply service hours to handyman requests and/or maintenance plans. Unused hours roll over up to six months. Additional service hours invoiced at $75/hour. Materials billed separately.</desc><rect x="18" y="18" width="444" height="624" rx="18" fill="#fff" stroke="#d5e1d9" stroke-width="1.5"/><path d="M36 19h408" stroke="#146657" stroke-width="4" stroke-linecap="round"/><text x="43" y="65" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="600" fill="#183e47" text-anchor="start" letter-spacing="0">Home Services</text><text x="43" y="142" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="67" font-weight="650" fill="#183e47" letter-spacing="-2" text-anchor="start">$150<tspan dx="7" font-size="23" font-weight="450" letter-spacing="0" fill="#536d6b">/month</tspan></text><text x="43" y="185" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" font-weight="450" fill="#536d6b" text-anchor="start" letter-spacing="0">One Simple Subscription</text><path d="M43 209h394" stroke="#d5e1d9" stroke-width="1.5"/><path d="m39 247 5 5 10-12" stroke="#146657" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="254" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Subscription includes two</text><text x="71" y="284" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">service hours each month.</text><path d="m39 322 5 5 10-12" stroke="#146657" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="329" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Apply service hours to handyman</text><text x="71" y="359" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">requests and/or maintenance plans.</text><path d="m39 397 5 5 10-12" stroke="#146657" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="404" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Unused hours roll over</text><text x="71" y="434" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">up to six months.</text><path d="m39 472 5 5 10-12" stroke="#146657" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="479" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Additional service hours</text><text x="71" y="509" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">invoiced at $75/hour.</text><path d="m39 547 5 5 10-12" stroke="#146657" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="554" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Materials billed separately.</text></svg>
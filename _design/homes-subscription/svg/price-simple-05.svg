<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="title desc"><title id="title">S5 — Hours included</title><desc id="desc">$150 per month. Subscription includes two service hours each month. Apply service hours to handyman requests and/or maintenance plans. Unused hours roll over up to six months. Additional service hours invoiced at $75/hour. Materials billed separately.</desc><rect x="18" y="18" width="444" height="624" rx="18" fill="#fff" stroke="#146657" stroke-width="2"/><text x="43" y="108" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="67" font-weight="650" fill="#183e47" letter-spacing="-2" text-anchor="start">$150<tspan dx="7" font-size="23" font-weight="450" letter-spacing="0" fill="#536d6b">/month</tspan></text><rect x="42" y="140" width="396" height="101" rx="10" fill="#e6eee2" stroke="none" stroke-width="1.5"/><text x="61" y="180" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="600" fill="#146657" text-anchor="start" letter-spacing="0">Subscription includes two</text><text x="61" y="212" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="600" fill="#146657" text-anchor="start" letter-spacing="0">service hours each month.</text><path d="m42 283 5 5 10-12" stroke="#146657" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="290" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Apply service hours to handyman</text><text x="74" y="320" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">requests and/or maintenance plans.</text><path d="m42 376 5 5 10-12" stroke="#146657" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="383" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Unused hours roll over</text><text x="74" y="413" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">up to six months.</text><path d="m42 469 5 5 10-12" stroke="#146657" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="476" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Additional service hours</text><text x="74" y="506" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">invoiced at $75/hour.</text><path d="m42 562 5 5 10-12" stroke="#146657" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="569" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Materials billed separately.</text></svg>
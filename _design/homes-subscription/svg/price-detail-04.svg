<svg xmlns="http://www.w3.org/2000/svg" width="480" height="700" viewBox="0 0 480 700" role="img" aria-labelledby="title desc"><title id="title">P4 — The clear service statement</title><desc id="desc">$150 per month. Two home service hours included each month. Service hours can apply to handyman requests and maintenance plans. Unused hours roll over up to six months. Additional service hours billed at $75 per man hour. Materials billed separately.</desc><ellipse cx="240" cy="678" rx="190" ry="10" fill="#183e47" opacity=".06"/><rect x="34" y="36" width="424" height="626" rx="20" fill="#dfe9da" stroke="none" stroke-width="1"/><rect x="24" y="24" width="424" height="626" rx="19" fill="#ffffff" stroke="#183e47" stroke-width="4"/><text x="51" y="65" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#146657" font-weight="700" text-anchor="start" letter-spacing="1.1">SUBSCRIPTION DETAILS</text><text x="236" y="133" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="61" fill="#183e47" font-weight="650" letter-spacing="-2" text-anchor="middle">$150<tspan dx="7" font-size="23" font-weight="500" letter-spacing="0" fill="#146657">/month</tspan></text><path d="M49 162H423" stroke="#183e47" stroke-width="2"/><text x="51" y="194" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#146657" font-weight="700" text-anchor="start" letter-spacing="1.1">INCLUDED EACH MONTH</text><text x="51" y="230" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" fill="#146657" font-weight="650" text-anchor="start" letter-spacing="0">2 home service hours</text><path d="M51 256H421" stroke="#c7d8ca" stroke-width="1.5"/><text x="51" y="286" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#146657" font-weight="700" text-anchor="start" letter-spacing="1.1">HOURS APPLY TO</text><text x="51" y="320" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" fill="#183e47" font-weight="500" text-anchor="start" letter-spacing="0">Handyman requests</text><text x="51" y="349" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" fill="#183e47" font-weight="500" text-anchor="start" letter-spacing="0">and maintenance plans</text><path d="M51 376H421" stroke="#c7d8ca" stroke-width="1.5"/><text x="51" y="406" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#146657" font-weight="700" text-anchor="start" letter-spacing="1.1">UNUSED HOURS</text><text x="51" y="440" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" fill="#183e47" font-weight="500" text-anchor="start" letter-spacing="0">Roll over up to 6 months</text><path d="M51 470H421" stroke="#c7d8ca" stroke-width="1.5"/><text x="51" y="500" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#146657" font-weight="700" text-anchor="start" letter-spacing="1.1">ADDITIONAL SERVICE HOURS</text><text x="51" y="536" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="29" fill="#146657" font-weight="650" text-anchor="start" letter-spacing="0">$75 / man hour</text><path d="M51 566H421" stroke="#c7d8ca" stroke-width="1.5"/><text x="51" y="608" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="#536d6b" font-weight="500" text-anchor="start" letter-spacing="0">Materials billed separately.</text></svg>
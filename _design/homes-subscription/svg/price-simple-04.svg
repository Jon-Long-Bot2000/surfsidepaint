<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="title desc"><title id="title">S4 — The minimal text card</title><desc id="desc">$150 per month. Subscription includes two service hours each month. Apply service hours to handyman requests and/or maintenance plans. Unused hours roll over up to six months. Additional service hours invoiced at $75/hour. Materials billed separately.</desc><rect x="18" y="18" width="444" height="624" rx="18" fill="#f8faf6" stroke="none" stroke-width="1.5"/><path d="M41 47v562" stroke="#146657" stroke-width="3" stroke-linecap="round"/><text x="65" y="67" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="600" fill="#183e47" text-anchor="start" letter-spacing="0">Subscription</text><text x="65" y="148" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="64" font-weight="650" fill="#183e47" letter-spacing="-2" text-anchor="start">$150<tspan dx="7" font-size="23" font-weight="450" letter-spacing="0" fill="#536d6b">/month</tspan></text><text x="65" y="227" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Subscription includes two</text><text x="65" y="257" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">service hours each month.</text><text x="65" y="305" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Apply service hours to handyman</text><text x="65" y="335" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">requests and/or maintenance plans.</text><text x="65" y="383" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Unused hours roll over</text><text x="65" y="413" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">up to six months.</text><text x="65" y="461" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Additional service hours</text><text x="65" y="491" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">invoiced at $75/hour.</text><text x="65" y="539" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Materials billed separately.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="700" viewBox="0 0 480 700" role="img" aria-labelledby="title desc"><title id="title">P5 — One shared pool of hours</title><desc id="desc">$150 per month. Two home service hours included each month. Service hours can apply to handyman requests and maintenance plans. Unused hours roll over up to six months. Additional service hours billed at $75 per man hour. Materials billed separately.</desc><ellipse cx="240" cy="678" rx="190" ry="10" fill="#183e47" opacity=".06"/><rect x="34" y="36" width="424" height="626" rx="20" fill="#dfe9da" stroke="none" stroke-width="1"/><rect x="24" y="24" width="424" height="626" rx="19" fill="#f6f3e7" stroke="#183e47" stroke-width="4"/><text x="236" y="114" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="63" fill="#183e47" font-weight="650" letter-spacing="-2" text-anchor="middle">$150<tspan dx="7" font-size="23" font-weight="500" letter-spacing="0" fill="#146657">/month</tspan></text><rect x="66" y="144" width="340" height="93" rx="15" fill="#dfe9da" stroke="none" stroke-width="1"/><text x="236" y="180" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" fill="#146657" font-weight="650" text-anchor="middle" letter-spacing="0">2 home service hours</text><text x="236" y="213" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="#536d6b" font-weight="500" text-anchor="middle" letter-spacing="0">included each month</text><path d="M236 238v22m0 0H139v18m97-18h97v18" fill="none" stroke="#146657" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="282" width="180" height="92" rx="12" fill="#ffffff" stroke="#c7d8ca" stroke-width="1.5"/><rect x="244" y="282" width="180" height="92" rx="12" fill="#ffffff" stroke="#c7d8ca" stroke-width="1.5"/><text x="138" y="319" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="#183e47" font-weight="600" text-anchor="middle" letter-spacing="0">Handyman</text><text x="138" y="346" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="#183e47" font-weight="600" text-anchor="middle" letter-spacing="0">requests</text><text x="334" y="319" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="#183e47" font-weight="600" text-anchor="middle" letter-spacing="0">Maintenance</text><text x="334" y="346" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="#183e47" font-weight="600" text-anchor="middle" letter-spacing="0">plans</text><text x="236" y="406" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" fill="#536d6b" font-weight="500" text-anchor="middle" letter-spacing="0">One shared allowance for both.</text><path d="M51 432H421" stroke="#c7d8ca" stroke-width="1.5"/><text x="236" y="467" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" fill="#183e47" font-weight="500" text-anchor="middle" letter-spacing="0">Unused hours roll over</text><text x="236" y="496" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" fill="#183e47" font-weight="500" text-anchor="middle" letter-spacing="0">up to 6 months.</text><text x="236" y="551" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="#146657" font-weight="600" text-anchor="middle" letter-spacing="0">Additional hours: $75/man hour</text><text x="236" y="605" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" fill="#536d6b" font-weight="500" text-anchor="middle" letter-spacing="0">Materials billed separately.</text></svg>
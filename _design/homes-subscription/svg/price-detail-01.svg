<svg xmlns="http://www.w3.org/2000/svg" width="480" height="700" viewBox="0 0 480 700" role="img" aria-labelledby="title desc"><title id="title">P1 — Everything at a glance</title><desc id="desc">$150 per month. Two home service hours included each month. Service hours can apply to handyman requests and maintenance plans. Unused hours roll over up to six months. Additional service hours billed at $75 per man hour. Materials billed separately.</desc><ellipse cx="240" cy="678" rx="190" ry="10" fill="#183e47" opacity=".06"/><rect x="34" y="36" width="424" height="626" rx="20" fill="#dfe9da" stroke="none" stroke-width="1"/><rect x="24" y="24" width="424" height="626" rx="19" fill="#f6f3e7" stroke="#183e47" stroke-width="4"/><text x="51" y="66" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#146657" font-weight="700" text-anchor="start" letter-spacing="1.1">ONE SIMPLE SUBSCRIPTION</text><text x="236" y="145" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="67" fill="#183e47" font-weight="650" letter-spacing="-2" text-anchor="middle">$150<tspan dx="7" font-size="23" font-weight="500" letter-spacing="0" fill="#146657">/month</tspan></text><text x="236" y="196" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="29" fill="#146657" font-weight="650" text-anchor="middle" letter-spacing="0">2 home service hours</text><text x="236" y="225" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" fill="#536d6b" font-weight="500" text-anchor="middle" letter-spacing="0">included each month</text><rect x="48" y="250" width="376" height="101" rx="13" fill="#dfe9da" stroke="none" stroke-width="1"/><text x="236" y="278" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#146657" font-weight="600" text-anchor="middle" letter-spacing="0">Use your hours for</text><text x="236" y="307" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" fill="#183e47" font-weight="600" text-anchor="middle" letter-spacing="0">Handyman requests</text><text x="236" y="336" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" fill="#183e47" font-weight="600" text-anchor="middle" letter-spacing="0">and maintenance plans</text><g transform="translate(66 394) scale(1)" fill="none" stroke="#146657" stroke-width="2.4" stroke-linecap="round"><circle cx="0" cy="0" r="11"/><path d="M0-6v7l5 3"/></g><text x="92" y="388" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" fill="#183e47" font-weight="500" text-anchor="start" letter-spacing="0">Unused hours roll over</text><text x="92" y="417" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" fill="#183e47" font-weight="500" text-anchor="start" letter-spacing="0">up to 6 months</text><path d="M51 445H421" stroke="#c7d8ca" stroke-width="1.5"/><text x="51" y="483" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" fill="#536d6b" font-weight="500" text-anchor="start" letter-spacing="0">Additional service hours</text><text x="51" y="519" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" fill="#146657" font-weight="650" text-anchor="start" letter-spacing="0">$75 / man hour</text><path d="M51 551H421" stroke="#c7d8ca" stroke-width="1.5"/><text x="236" y="594" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" fill="#536d6b" font-weight="500" text-anchor="middle" letter-spacing="0">Materials billed separately.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="title desc"><title id="title">S3 — A soft green header</title><desc id="desc">$150 per month. Subscription includes two service hours each month. Apply service hours to handyman requests and/or maintenance plans. Unused hours roll over up to six months. Additional service hours invoiced at $75/hour. Materials billed separately.</desc><rect x="18" y="18" width="444" height="624" rx="18" fill="#fff" stroke="#d5e1d9" stroke-width="1.5"/><rect x="19" y="19" width="442" height="166" rx="17" fill="#e6eee2" stroke="none" stroke-width="1.5"/><rect x="19" y="158" width="442" height="27" rx="0" fill="#e6eee2" stroke="none" stroke-width="1.5"/><text x="43" y="62" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="600" fill="#146657" text-anchor="start" letter-spacing="0">One Simple Subscription</text><text x="43" y="140" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="67" font-weight="650" fill="#183e47" letter-spacing="-2" text-anchor="start">$150<tspan dx="7" font-size="23" font-weight="450" letter-spacing="0" fill="#536d6b">/month</tspan></text><text x="43" y="232" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="600" fill="#183e47" text-anchor="start" letter-spacing="0">Subscription includes two</text><text x="43" y="265" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="600" fill="#183e47" text-anchor="start" letter-spacing="0">service hours each month.</text><path d="M43 292h394" stroke="#d5e1d9" stroke-width="1.5"/><path d="m42 330 5 5 10-12" stroke="#146657" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="73" y="337" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Apply service hours to handyman</text><text x="73" y="367" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">requests and/or maintenance plans.</text><path d="m42 408 5 5 10-12" stroke="#146657" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="73" y="415" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Unused hours roll over</text><text x="73" y="445" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">up to six months.</text><path d="m42 486 5 5 10-12" stroke="#146657" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="73" y="493" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Additional service hours</text><text x="73" y="523" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">invoiced at $75/hour.</text><path d="m42 564 5 5 10-12" stroke="#146657" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="73" y="571" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="450" fill="#183e47" text-anchor="start" letter-spacing="0">Materials billed separately.</text></svg>
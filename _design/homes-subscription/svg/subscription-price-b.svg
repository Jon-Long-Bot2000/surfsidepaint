<svg xmlns="http://www.w3.org/2000/svg" width="360" height="270" viewBox="0 0 360 270" role="img" aria-labelledby="title desc"><title id="title">P1B — monthly subscription seal</title><desc id="desc">A round cream seal with a dark outline and fine inner ring, displaying $150 per month.</desc><ellipse cx="178" cy="243" rx="118" ry="10" fill="#183e47" opacity=".06"/><rect x="48" y="35" width="250" height="202" rx="18" fill="#dfe9da"/><circle cx="175" cy="135" r="102" fill="#f6f3e7" stroke="#183e47" stroke-width="5"/><circle cx="175" cy="135" r="90" fill="none" stroke="#c7d8ca" stroke-width="2"/><text x="175" y="83" fill="#146657" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.2" text-anchor="middle">ONE SUBSCRIPTION</text><text x="175" y="145" fill="#183e47" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="54" font-weight="650" letter-spacing="-2.7" text-anchor="middle">$150</text><text x="175" y="174" fill="#146657" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="550" letter-spacing="0" text-anchor="middle">/ month</text><path d="M139 192h72" stroke="#c7d8ca" stroke-width="2" stroke-linecap="round"/><circle cx="129" cy="192" r="2" fill="#146657"/><circle cx="221" cy="192" r="2" fill="#146657"/></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="700" viewBox="0 0 480 700" role="img" aria-labelledby="title desc"><title id="title">P6 — The membership pass</title><desc id="desc">$150 per month. Two home service hours included each month. Service hours can apply to handyman requests and maintenance plans. Unused hours roll over up to six months. Additional service hours billed at $75 per man hour. Materials billed separately.</desc><ellipse cx="240" cy="678" rx="190" ry="10" fill="#183e47" opacity=".06"/><rect x="34" y="36" width="424" height="626" rx="20" fill="#dfe9da" stroke="none" stroke-width="1"/><rect x="24" y="24" width="424" height="626" rx="19" fill="#ffffff" stroke="#183e47" stroke-width="4"/><rect x="24" y="24" width="424" height="203" rx="19" fill="#146657" stroke="none" stroke-width="1"/><rect x="24" y="184" width="424" height="43" rx="0" fill="#146657" stroke="none" stroke-width="1"/><text x="52" y="66" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#f6f3e7" font-weight="700" text-anchor="start" letter-spacing="0.8">ONE SIMPLE SUBSCRIPTION</text><text x="54" y="140" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="59" fill="#f6f3e7" font-weight="650" letter-spacing="-2" text-anchor="start">$150<tspan dx="7" font-size="23" font-weight="500" letter-spacing="0" fill="#f6f3e7">/month</tspan></text><text x="395" y="145" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="83" fill="#f6f3e7" font-weight="650" text-anchor="middle" letter-spacing="0">2</text><text x="395" y="174" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#f6f3e7" font-weight="650" text-anchor="middle" letter-spacing="1">HOURS</text><text x="52" y="207" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#f6f3e7" font-weight="550" text-anchor="start" letter-spacing="0">2 home service hours included each month</text><text x="51" y="266" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#146657" font-weight="700" text-anchor="start" letter-spacing="1.1">USE YOUR HOURS FOR</text><text x="51" y="304" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" fill="#183e47" font-weight="600" text-anchor="start" letter-spacing="0">Handyman requests</text><text x="51" y="335" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" fill="#183e47" font-weight="600" text-anchor="start" letter-spacing="0">and maintenance plans</text><rect x="48" y="374" width="376" height="101" rx="13" fill="#dfe9da" stroke="none" stroke-width="1"/><g transform="translate(75 414) scale(1)" fill="none" stroke="#146657" stroke-width="2.4" stroke-linecap="round"><circle cx="0" cy="0" r="11"/><path d="M0-6v7l5 3"/></g><text x="101" y="406" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" fill="#183e47" font-weight="500" text-anchor="start" letter-spacing="0">Unused hours roll over</text><text x="101" y="435" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" fill="#183e47" font-weight="500" text-anchor="start" letter-spacing="0">up to 6 months.</text><text x="51" y="520" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#146657" font-weight="700" text-anchor="start" letter-spacing="1.1">ADDITIONAL SERVICE HOURS</text><text x="51" y="557" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="29" fill="#146657" font-weight="650" text-anchor="start" letter-spacing="0">$75 / man hour</text><text x="51" y="614" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" fill="#536d6b" font-weight="500" text-anchor="start" letter-spacing="0">Materials billed separately.</text><rect x="24" y="24" width="424" height="626" rx="19" fill="none" stroke="#183e47" stroke-width="4"/></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="700" viewBox="0 0 480 700" role="img" aria-labelledby="title desc"><title id="title">P3 — The 2–6–75 guide</title><desc id="desc">$150 per month. Two home service hours included each month. Service hours can apply to handyman requests and maintenance plans. Unused hours roll over up to six months. Additional service hours billed at $75 per man hour. Materials billed separately.</desc><ellipse cx="240" cy="678" rx="190" ry="10" fill="#183e47" opacity=".06"/><rect x="34" y="36" width="424" height="626" rx="20" fill="#dfe9da" stroke="none" stroke-width="1"/><rect x="24" y="24" width="424" height="626" rx="19" fill="#f6f3e7" stroke="#183e47" stroke-width="4"/><text x="51" y="66" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#146657" font-weight="700" text-anchor="start" letter-spacing="1.1">YOUR HOME CARE MEMBERSHIP</text><text x="236" y="144" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="64" fill="#183e47" font-weight="650" letter-spacing="-2" text-anchor="middle">$150<tspan dx="7" font-size="23" font-weight="500" letter-spacing="0" fill="#146657">/month</tspan></text><path d="M79 218L79 526" fill="none" stroke="#c7d8ca" stroke-width="2" stroke-linecap="round"/><circle cx="79" cy="228" r="28" fill="#dfe9da"/><text x="79" y="238" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" fill="#146657" font-weight="650" text-anchor="middle" letter-spacing="0">2</text><text x="124" y="218" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" fill="#183e47" font-weight="600" text-anchor="start" letter-spacing="0">Home service hours</text><text x="124" y="246" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" fill="#183e47" font-weight="600" text-anchor="start" letter-spacing="0">included each month</text><text x="124" y="279" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" fill="#536d6b" font-weight="500" text-anchor="start" letter-spacing="0">For handyman requests</text><text x="124" y="305" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" fill="#536d6b" font-weight="500" text-anchor="start" letter-spacing="0">and maintenance plans.</text><circle cx="79" cy="373" r="28" fill="#dfe9da"/><text x="79" y="383" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" fill="#146657" font-weight="650" text-anchor="middle" letter-spacing="0">6</text><text x="124" y="363" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" fill="#146657" font-weight="650" text-anchor="start" letter-spacing="0">Months of rollover</text><text x="124" y="395" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" fill="#536d6b" font-weight="500" text-anchor="start" letter-spacing="0">Unused hours roll over</text><text x="124" y="422" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" fill="#536d6b" font-weight="500" text-anchor="start" letter-spacing="0">up to 6 months.</text><circle cx="79" cy="508" r="28" fill="#dfe9da"/><text x="79" y="518" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" fill="#146657" font-weight="650" text-anchor="middle" letter-spacing="0">75</text><text x="124" y="502" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="27" fill="#146657" font-weight="650" text-anchor="start" letter-spacing="0">$75 / man hour</text><text x="124" y="534" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" fill="#536d6b" font-weight="500" text-anchor="start" letter-spacing="0">Additional service hours</text><path d="M51 577H421" stroke="#c7d8ca" stroke-width="1.5"/><text x="236" y="614" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" fill="#536d6b" font-weight="500" text-anchor="middle" letter-spacing="0">Materials billed separately.</text></svg>